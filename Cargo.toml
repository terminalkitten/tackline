[package]
name = "tackline"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Point at code, write what your coding agent should do there, and hand it one Markdown prompt. Works with Claude Code, Codex, opencode, aider, Cursor and any agent that takes a prompt."
license = "MIT"
repository = "https://github.com/terminalkitten/tackline"
homepage = "https://terminalkitten.github.io/tackline/"
readme = "README.md"
keywords = ["tui", "ai", "agent", "prompt", "coding-agent"]
categories = ["command-line-utilities", "development-tools"]
# Docs site, screenshots and CI stay in the repository.
exclude = ["docs/", ".github/"]

[dependencies]
anyhow = "1"
arboard = { version = "3.7.0", default-features = false }
askama = "0.16.1"
axum = "0.8.9"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
# No https/ssh: tackline never talks to remotes, and no OpenSSL makes
# cross-platform release builds simple.
git2 = { version = "0.21", default-features = false }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
jiff = { version = "0.2", features = ["serde"] }
nucleo = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug = "0.1.6"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.54", features = ["rt", "net"] }
tui-realm-stdlib = "4.1"
tui-realm-textarea = "4.1"
tui-realm-treeview = "4.1"
tuirealm = "4.1"
two-face = "0.5.2"
ulid = "3"

[dev-dependencies]
insta = "1.49"
tower = { version = "0.5", features = ["util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
