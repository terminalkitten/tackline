[package]
name = "tackline"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Steer coding agents from your terminal: put prompt instructions on lines of code, group them in sessions, and compile one prompt for Claude Code."
license = "MIT"
repository = "https://github.com/terminalkitten/tackline"
homepage = "https://terminalkitten.github.io/tackline/"
readme = "README.md"
keywords = ["tui", "ai", "agent", "prompt", "claude"]
categories = ["command-line-utilities", "development-tools"]
# Docs site, screenshots and CI stay in the repository.
exclude = ["docs/", ".github/"]

[dependencies]
anyhow = "1"
arboard = { version = "3.7.0", default-features = false }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
git2 = "0.21"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
jiff = { version = "0.2", features = ["serde"] }
nucleo = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug = "0.1.6"
tempfile = "3.27"
thiserror = "2"
tui-realm-stdlib = "4.1"
tui-realm-textarea = "4.1"
tui-realm-treeview = "4.1"
tuirealm = "4.1"
two-face = "0.5.2"
ulid = "3"

[dev-dependencies]
insta = "1.49"
