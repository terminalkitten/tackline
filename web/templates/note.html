{% extends "base.html" %}
{% block title %}Note · tackline{% endblock %}
{% block layout %}wide{% endblock %}
{% block body %}
<main class="note-edit">
  <p><a href="{{ back }}">← Back</a></p>
  <h1>{{ location }}</h1>
  <pre class="snippet">{% for l in code %}{{ l|safe }}
{% endfor %}</pre>
  <form action="/notes/{{ id }}" method="post">
    <input type="hidden" name="return" value="{{ back }}">
    <textarea name="text" rows="6" required>{{ text }}</textarea>
    <div class="add-note-foot">
      <label>Session
        <select name="session">
          {% for s in nav.sessions %}<option value="{{ s.id }}" {% if s.id == session_id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
        </select>
      </label>
      <button class="primary">Save</button>
    </div>
    <p class="hint">Pick another session to move the note there.</p>
  </form>
  <form action="/notes/{{ id }}/delete" method="post" onsubmit="return confirm('Delete this note?')">
    <input type="hidden" name="return" value="{{ back }}">
    <button class="danger">Delete note</button>
  </form>
</main>
{% endblock %}
